# Phase 05 agent settings. Limits are per case. The cost cap comes from the
# Phase 02 target ($0.05 per case) and is revised after the Phase 06 pilot.
# model_alias: null uses the default alias in config/models.yaml.
model_alias: null
max_output_tokens: 1024
ledger: true
verify: true
memory: false
memory_frozen: false
limits:
  tool_calls: 15
  model_turns: 30
  wall_time_s: 600
  cost_usd: 0.05
  # Set aside before investigation starts, for verify and one correction.
  verify_tool_calls: 2
  verify_model_turns: 4
  verify_cost_usd: 0.01
  correction_model_turns: 3
context:
  keep_recent_results: 3
  digest_block: 3
  digest_lines: 3
  digest_line_chars: 160
