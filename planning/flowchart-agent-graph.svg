<svg width="100%" viewBox="0 0 680 490" role="img" xmlns="http://www.w3.org/2000/svg"><title>Agent graph: nodes, ledger, limits and grounding check</title><desc>The agent starts at Orient, deterministic code that builds a briefing from the catalog. Investigate is a model step that picks the next tool; it exchanges calls with Tools, whose results are capped, and reads and writes the hypothesis ledger. Every ledger update passes a grounding check in code that requires each claim to cite a real tool call. When the model submits, Verify runs one check that could disprove the top hypothesis. If the hypothesis is disproved the run returns to Investigate; if it holds the run moves to Report, which outputs a ranked diagnosis with evidence. A limits component forces a submit straight to Report when the tool-call or cost limit is reached.</desc>
<style>
:root{--ink:#2C2C2A;--sub:#5F5E5A;--line:#8A8A86;--bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--ink:#EDEDEA;--sub:#B4B2A9;--line:#6b6b68;--bg:#141414}}
svg{background:var(--bg)}
text{font-family:-apple-system,Helvetica,Arial,sans-serif}
.ts{font-size:12px;font-weight:400;fill:var(--sub)}
.th{font-size:14px;font-weight:500;fill:var(--ink)}
.arr{stroke:var(--line);stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#888780}
.c-gray text.th{fill:#2C2C2A}
.c-gray text.ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#7F77DD}
.c-purple text.th{fill:#3C3489}
.c-purple text.ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#1D9E75}
.c-teal text.th{fill:#085041}
.c-teal text.ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#D85A30}
.c-coral text.th{fill:#712B13}
.c-coral text.ts{fill:#993C1D}
@media (prefers-color-scheme: dark){
.c-gray rect{fill:#444441;stroke:#B4B2A9}
.c-gray text.th{fill:#F1EFE8}
.c-gray text.ts{fill:#D3D1C7}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}
.c-purple text.th{fill:#EEEDFE}
.c-purple text.ts{fill:#CECBF6}
.c-teal rect{fill:#085041;stroke:#5DCAA5}
.c-teal text.th{fill:#E1F5EE}
.c-teal text.ts{fill:#9FE1CB}
.c-coral rect{fill:#712B13;stroke:#F0997B}
.c-coral text.th{fill:#FAECE7}
.c-coral text.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Main column -->
<g class="c-gray"><rect x="230" y="30" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Orient</text><text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">catalog briefing · no LLM</text></g>
<line x1="340" y1="86" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="230" y="126" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Investigate</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">model picks the next tool</text></g>
<line x1="340" y1="182" x2="340" y2="236" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="210" dominant-baseline="central">submit</text>
<g class="c-purple"><rect x="230" y="242" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="260" text-anchor="middle" dominant-baseline="central">Verify</text><text class="ts" x="340" y="278" text-anchor="middle" dominant-baseline="central">one check that could disprove</text></g>
<line x1="340" y1="298" x2="340" y2="352" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="348" y="326" dominant-baseline="central">holds</text>
<g class="c-purple"><rect x="230" y="358" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="376" text-anchor="middle" dominant-baseline="central">Report</text><text class="ts" x="340" y="394" text-anchor="middle" dominant-baseline="central">ranked diagnosis + evidence</text></g>

<!-- Verify back to Investigate -->
<path d="M450 270 L472 270 L472 170 L456 170" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="480" y="222" dominant-baseline="central">disproved</text>

<!-- Left column: ledger and grounding -->
<g class="c-coral"><rect x="20" y="126" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="144" text-anchor="middle" dominant-baseline="central">Hypothesis ledger</text><text class="ts" x="105" y="162" text-anchor="middle" dominant-baseline="central">evidence for / against</text></g>
<line x1="196" y1="154" x2="224" y2="154" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="105" y1="182" x2="105" y2="236" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="113" y="210" dominant-baseline="central">every update</text>
<g class="c-gray"><rect x="20" y="242" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="105" y="260" text-anchor="middle" dominant-baseline="central">Grounding check</text><text class="ts" x="105" y="278" text-anchor="middle" dominant-baseline="central">claims cite tool calls</text></g>

<!-- Right column: tools and limits -->
<g class="c-teal"><rect x="490" y="126" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575" y="144" text-anchor="middle" dominant-baseline="central">Tools</text><text class="ts" x="575" y="162" text-anchor="middle" dominant-baseline="central">capped results</text></g>
<line x1="456" y1="142" x2="484" y2="142" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="490" y="358" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575" y="376" text-anchor="middle" dominant-baseline="central">Limits</text><text class="ts" x="575" y="394" text-anchor="middle" dominant-baseline="central">forced submit at limit</text></g>
<line x1="484" y1="386" x2="456" y2="386" class="arr" marker-end="url(#arrow)"/>

<!-- Legend -->
<g class="c-purple"><rect x="60" y="456" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="76" y="461" dominant-baseline="central">Model step</text>
<g class="c-teal"><rect x="180" y="456" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="196" y="461" dominant-baseline="central">Tools</text>
<g class="c-coral"><rect x="270" y="456" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="286" y="461" dominant-baseline="central">Run state</text>
<g class="c-gray"><rect x="380" y="456" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="396" y="461" dominant-baseline="central">Deterministic code</text>
</svg>
