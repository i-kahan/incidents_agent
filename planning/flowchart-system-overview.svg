<svg width="100%" viewBox="0 0 680 700" role="img" xmlns="http://www.w3.org/2000/svg"><title>Incidents Agent system overview</title><desc>Two entry points, the Streamlit upload page and the eval runner over RCAEval blind cases, hand a folder of files to Ingest. Ingest loads the files into a read-only DuckDB database: one table per data or log file, and structure-based chunks for documents. The agent is a LangGraph graph with four nodes in order: Orient, Investigate, Verify and Report, with a path from Verify back to Investigate. Investigate calls Tools, which query DuckDB. Investigate and Verify call the model layer, built on LiteLLM with a spend guard that reserves each attempt in a shared SQLite ledger under a configurable budget cap, which reaches OpenAI, Anthropic and Google. An optional incident memory with BM25 lookup is read during investigation and written after the report. The agent produces an incident report for the upload page and a predictions file scored by RCAEval.</desc>
<style>
:root{--ink:#2C2C2A;--sub:#5F5E5A;--line:#8A8A86;--bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--ink:#EDEDEA;--sub:#B4B2A9;--line:#6b6b68;--bg:#141414}}
svg{background:var(--bg)}
text{font-family:-apple-system,Helvetica,Arial,sans-serif}
.ts{font-size:12px;font-weight:400;fill:var(--sub)}
.th{font-size:14px;font-weight:500;fill:var(--ink)}
.arr{stroke:var(--line);stroke-width:1.5;fill:none}
.dashed-container{fill:none;stroke:var(--line)}
.dashed-swatch{fill:none;stroke:var(--sub)}
.c-gray rect{fill:#F1EFE8;stroke:#888780}
.c-gray text.th{fill:#2C2C2A}
.c-gray text.ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#7F77DD}
.c-purple text.th{fill:#3C3489}
.c-purple text.ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#1D9E75}
.c-teal text.th{fill:#085041}
.c-teal text.ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#D85A30}
.c-coral text.th{fill:#712B13}
.c-coral text.ts{fill:#993C1D}
@media (prefers-color-scheme: dark){
.c-gray rect{fill:#444441;stroke:#B4B2A9}
.c-gray text.th{fill:#F1EFE8}
.c-gray text.ts{fill:#D3D1C7}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}
.c-purple text.th{fill:#EEEDFE}
.c-purple text.ts{fill:#CECBF6}
.c-teal rect{fill:#085041;stroke:#5DCAA5}
.c-teal text.th{fill:#E1F5EE}
.c-teal text.ts{fill:#9FE1CB}
.c-coral rect{fill:#712B13;stroke:#F0997B}
.c-coral text.th{fill:#FAECE7}
.c-coral text.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Entry points -->
<g class="c-purple"><rect x="40" y="30" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="48" text-anchor="middle" dominant-baseline="central">Upload page</text><text class="ts" x="125" y="66" text-anchor="middle" dominant-baseline="central">Streamlit · local</text></g>
<g class="c-purple"><rect x="230" y="30" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="315" y="48" text-anchor="middle" dominant-baseline="central">Eval runner</text><text class="ts" x="315" y="66" text-anchor="middle" dominant-baseline="central">RCAEval blind cases</text></g>
<path d="M125 86 L125 104 L220 104 L220 120" class="arr" marker-end="url(#arrow)"/>
<path d="M315 86 L315 104 L220 104" class="arr"/>

<!-- Ingest and store -->
<g class="c-teal"><rect x="90" y="126" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="144" text-anchor="middle" dominant-baseline="central">Ingest</text><text class="ts" x="220" y="162" text-anchor="middle" dominant-baseline="central">files → tables, documents, catalog</text></g>
<line x1="350" y1="154" x2="444" y2="154" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="450" y="126" width="210" height="56" rx="8" stroke-width="0.5"/><text class="th" x="555" y="144" text-anchor="middle" dominant-baseline="central">DuckDB · read-only</text><text class="ts" x="555" y="162" text-anchor="middle" dominant-baseline="central">tables + document chunks</text></g>
<line x1="220" y1="182" x2="220" y2="212" class="arr" marker-end="url(#arrow)"/>

<!-- Agent -->
<rect x="40" y="218" width="360" height="330" rx="8" class="dashed-container" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="54" y="236">Agent · LangGraph</text>
<g class="c-teal"><rect x="90" y="250" width="260" height="52" rx="8" stroke-width="0.5"/><text class="th" x="220" y="267" text-anchor="middle" dominant-baseline="central">Orient</text><text class="ts" x="220" y="285" text-anchor="middle" dominant-baseline="central">catalog briefing · no LLM</text></g>
<line x1="220" y1="302" x2="220" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="90" y="324" width="260" height="52" rx="8" stroke-width="0.5"/><text class="th" x="220" y="341" text-anchor="middle" dominant-baseline="central">Investigate</text><text class="ts" x="220" y="359" text-anchor="middle" dominant-baseline="central">tool loop + hypothesis ledger</text></g>
<line x1="220" y1="376" x2="220" y2="392" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="90" y="398" width="260" height="52" rx="8" stroke-width="0.5"/><text class="th" x="220" y="415" text-anchor="middle" dominant-baseline="central">Verify</text><text class="ts" x="220" y="433" text-anchor="middle" dominant-baseline="central">one check that could disprove</text></g>
<path d="M90 424 L64 424 L64 350 L84 350" class="arr" marker-end="url(#arrow)"/>
<line x1="220" y1="450" x2="220" y2="466" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="90" y="472" width="260" height="52" rx="8" stroke-width="0.5"/><text class="th" x="220" y="489" text-anchor="middle" dominant-baseline="central">Report</text><text class="ts" x="220" y="507" text-anchor="middle" dominant-baseline="central">ranked diagnosis + evidence</text></g>

<!-- Right column: tools, model layer, providers, memory -->
<g class="c-teal"><rect x="450" y="324" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="555" y="341" text-anchor="middle" dominant-baseline="central">Tools</text><text class="ts" x="555" y="359" text-anchor="middle" dominant-baseline="central">SQL · search · compare · graph</text></g>
<line x1="356" y1="350" x2="444" y2="350" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="555" y1="324" x2="555" y2="188" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="450" y="398" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="555" y="415" text-anchor="middle" dominant-baseline="central">Model layer · LiteLLM</text><text class="ts" x="555" y="433" text-anchor="middle" dominant-baseline="central">spend guard · SQLite ledger</text></g>
<line x1="356" y1="424" x2="444" y2="424" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="555" y1="450" x2="555" y2="466" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="450" y="472" width="210" height="52" rx="8" stroke-width="0.5"/><text class="th" x="555" y="489" text-anchor="middle" dominant-baseline="central">Providers</text><text class="ts" x="555" y="507" text-anchor="middle" dominant-baseline="central">OpenAI · Anthropic · Google</text></g>
<g class="c-teal"><rect x="450" y="572" width="210" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="555" y="590" text-anchor="middle" dominant-baseline="central">Incident memory</text><text class="ts" x="555" y="608" text-anchor="middle" dominant-baseline="central">optional · BM25 lookup</text></g>
<path d="M356 506 L424 506 L424 600 L444 600" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<!-- Outputs -->
<path d="M220 548 L220 568 L125 568 L125 584" class="arr" marker-end="url(#arrow)"/>
<path d="M220 568 L315 568 L315 584" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="590" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="125" y="608" text-anchor="middle" dominant-baseline="central">Incident report</text><text class="ts" x="125" y="626" text-anchor="middle" dominant-baseline="central">evidence · actions</text></g>
<g class="c-gray"><rect x="230" y="590" width="170" height="56" rx="8" stroke-width="0.5"/><text class="th" x="315" y="608" text-anchor="middle" dominant-baseline="central">predictions.jsonl</text><text class="ts" x="315" y="626" text-anchor="middle" dominant-baseline="central">scored by RCAEval</text></g>

<!-- Legend -->
<g class="c-purple"><rect x="40" y="672" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="56" y="677" dominant-baseline="central">Entry points</text>
<g class="c-teal"><rect x="150" y="672" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="166" y="677" dominant-baseline="central">Agent and tools</text>
<g class="c-coral"><rect x="280" y="672" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="296" y="677" dominant-baseline="central">Data and models</text>
<g class="c-gray"><rect x="412" y="672" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="428" y="677" dominant-baseline="central">External / outputs</text>
<rect x="552" y="672" width="10" height="10" rx="2" class="dashed-swatch" stroke-width="0.5" stroke-dasharray="3 2"/><text class="ts" x="568" y="677" dominant-baseline="central">Optional</text>
</svg>
