<svg width="100%" viewBox="0 0 680 790" role="img" xmlns="http://www.w3.org/2000/svg"><title>Evaluation harness: from the dataset to the comparison table</title><desc>The RCAEval RE2-OB dataset of 90 labelled cases is exported as a blind view of anonymised case folders, with the labels written to a separate answers file that is hidden from the agent. A seeded split divides the cases into 30 for tuning and 60 held out. The eval runner, which is parallel, cached and resumable, calls the agent once per case. The BARO and multi-source BARO baselines, free and with no LLM, run on the same split; held-out is scored as aggregates only. Both write one prediction JSON line per case. The agent runner also saves trajectories. The RCAEval evaluator scores the predictions against the answers file for accuracy at top 1, 3 and 5. A separate field set of seven hand-built cases in other shapes, six incidents and one healthy system, also goes through the runner and is scored separately for rank, category, retrieval and citation. The results feed a comparison table with intervals and paired tests, and a per-case failure report.</desc>
<style>
:root{--ink:#2C2C2A;--sub:#5F5E5A;--line:#8A8A86;--bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--ink:#EDEDEA;--sub:#B4B2A9;--line:#6b6b68;--bg:#141414}}
svg{background:var(--bg)}
text{font-family:-apple-system,Helvetica,Arial,sans-serif}
.ts{font-size:12px;font-weight:400;fill:var(--sub)}
.th{font-size:14px;font-weight:500;fill:var(--ink)}
.arr{stroke:var(--line);stroke-width:1.5;fill:none}
.c-gray rect{fill:#F1EFE8;stroke:#888780}
.c-gray text.th{fill:#2C2C2A}
.c-gray text.ts{fill:#5F5E5A}
.c-purple rect{fill:#EEEDFE;stroke:#7F77DD}
.c-purple text.th{fill:#3C3489}
.c-purple text.ts{fill:#534AB7}
.c-teal rect{fill:#E1F5EE;stroke:#1D9E75}
.c-teal text.th{fill:#085041}
.c-teal text.ts{fill:#0F6E56}
.c-coral rect{fill:#FAECE7;stroke:#D85A30}
.c-coral text.th{fill:#712B13}
.c-coral text.ts{fill:#993C1D}
@media (prefers-color-scheme: dark){
.c-gray rect{fill:#444441;stroke:#B4B2A9}
.c-gray text.th{fill:#F1EFE8}
.c-gray text.ts{fill:#D3D1C7}
.c-purple rect{fill:#3C3489;stroke:#AFA9EC}
.c-purple text.th{fill:#EEEDFE}
.c-purple text.ts{fill:#CECBF6}
.c-teal rect{fill:#085041;stroke:#5DCAA5}
.c-teal text.th{fill:#E1F5EE}
.c-teal text.ts{fill:#9FE1CB}
.c-coral rect{fill:#712B13;stroke:#F0997B}
.c-coral text.th{fill:#FAECE7}
.c-coral text.ts{fill:#F5C4B3}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- Dataset and export -->
<g class="c-coral"><rect x="230" y="30" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">RCAEval RE2-OB</text><text class="ts" x="340" y="66" text-anchor="middle" dominant-baseline="central">90 labelled cases</text></g>
<line x1="340" y1="86" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="230" y="126" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Blind export</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">anonymised case folders</text></g>
<line x1="450" y1="154" x2="484" y2="154" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="490" y="126" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="570" y="144" text-anchor="middle" dominant-baseline="central">Answers file</text><text class="ts" x="570" y="162" text-anchor="middle" dominant-baseline="central">hidden from the agent</text></g>
<line x1="340" y1="182" x2="340" y2="216" class="arr" marker-end="url(#arrow)"/>

<!-- Field set -->
<g class="c-coral"><rect x="490" y="222" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="570" y="240" text-anchor="middle" dominant-baseline="central">Field set</text><text class="ts" x="570" y="258" text-anchor="middle" dominant-baseline="central">7 hand-built cases</text></g>
<path d="M570 278 L570 296 L400 296 L400 312" class="arr" marker-end="url(#arrow)"/>

<!-- Split -->
<g class="c-teal"><rect x="230" y="222" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="240" text-anchor="middle" dominant-baseline="central">Seeded split</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">30 tuning · 60 held-out</text></g>
<line x1="340" y1="278" x2="340" y2="312" class="arr" marker-end="url(#arrow)"/>
<path d="M230 250 L110 250 L110 312" class="arr" marker-end="url(#arrow)"/>

<!-- Runner, agent, baseline -->
<g class="c-gray"><rect x="30" y="318" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="336" text-anchor="middle" dominant-baseline="central">BARO baselines</text><text class="ts" x="110" y="354" text-anchor="middle" dominant-baseline="central">raw · guarded · multi-source</text></g>
<g class="c-teal"><rect x="230" y="318" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="336" text-anchor="middle" dominant-baseline="central">Eval runner</text><text class="ts" x="340" y="354" text-anchor="middle" dominant-baseline="central">parallel · cached · resumable</text></g>
<line x1="456" y1="346" x2="484" y2="346" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="490" y="318" width="160" height="56" rx="8" stroke-width="0.5"/><text class="th" x="570" y="336" text-anchor="middle" dominant-baseline="central">Agent</text><text class="ts" x="570" y="354" text-anchor="middle" dominant-baseline="central">one run per case</text></g>
<line x1="340" y1="374" x2="340" y2="408" class="arr" marker-end="url(#arrow)"/>
<path d="M110 374 L110 442 L224 442" class="arr" marker-end="url(#arrow)"/>

<!-- Predictions and scoring -->
<g class="c-coral"><rect x="230" y="414" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="432" text-anchor="middle" dominant-baseline="central">Predictions</text><text class="ts" x="340" y="450" text-anchor="middle" dominant-baseline="central">agent trajectories separate</text></g>
<line x1="340" y1="470" x2="340" y2="504" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="230" y="510" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="528" text-anchor="middle" dominant-baseline="central">RCAEval evaluator</text><text class="ts" x="340" y="546" text-anchor="middle" dominant-baseline="central">accuracy at top 1, 3, 5</text></g>
<path d="M650 154 L666 154 L666 538 L456 538" class="arr" marker-end="url(#arrow)"/>

<!-- Outputs -->
<path d="M340 566 L340 584 L220 584 L220 600" class="arr" marker-end="url(#arrow)"/>
<path d="M340 584 L460 584 L460 600" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="120" y="606" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="624" text-anchor="middle" dominant-baseline="central">Comparison table</text><text class="ts" x="220" y="642" text-anchor="middle" dominant-baseline="central">intervals · paired tests</text></g>
<g class="c-gray"><rect x="360" y="606" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="460" y="624" text-anchor="middle" dominant-baseline="central">Failure report</text><text class="ts" x="460" y="642" text-anchor="middle" dominant-baseline="central">per-case breakdown</text></g>

<!-- Separate field report -->
<path d="M450 453 L598 453 L598 669" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="488" y="675" width="164" height="45" rx="8" stroke-width="0.5"/><text class="th" x="570" y="689" text-anchor="middle" dominant-baseline="central">Field scorer</text><text class="ts" x="570" y="706" text-anchor="middle" dominant-baseline="central">separate counts out of 7</text></g>
<!-- Legend -->
<g class="c-teal"><rect x="80" y="752" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="96" y="757" dominant-baseline="central">Eval code</text>
<g class="c-purple"><rect x="190" y="752" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="206" y="757" dominant-baseline="central">Agent</text>
<g class="c-coral"><rect x="280" y="752" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="296" y="757" dominant-baseline="central">Data</text>
<g class="c-gray"><rect x="360" y="752" width="10" height="10" rx="2" stroke-width="0.5"/></g><text class="ts" x="376" y="757" dominant-baseline="central">Baseline and outputs</text>
</svg>
